<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>甜蜜告白墙</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-flowers"></div>
  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow">Love Letter Studio</p>
      <h1>把心里的悄悄话写给 TA</h1>
      <p class="lede">一封中文告白、一段甜蜜留言、一句想对 TA 说的话，都可以在这里被温柔收藏。</p>
      <div class="cta-row">
        <a class="btn primary" href="#write">写一封告白</a>
        <button class="btn ghost" id="random-line">给我一句灵感 ✨</button>
      </div>
      <p class="tip">已经累计 <span id="count">0</span> 封温柔告白</p>
    </div>
    <div class="hero-card">
      <div class="floating-heart">❤</div>
      <p class="quote" id="typewriter"></p>
      <p class="quote-from">— 致你喜欢的人</p>
    </div>
  </header>

  <main>
    <section id="write" class="card">
      <div class="card-head">
        <div>
          <p class="eyebrow">写下此刻的心意</p>
          <h2>甜蜜表白表单</h2>
          <p class="muted">不需要勇气的测试版，先把话写在这里，看看心跳的频率。</p>
        </div>
        <span class="badge">匿名保存</span>
      </div>
      <form id="confession-form" class="form-grid">
        <label>
          你的名字
          <input type="text" id="from" placeholder="我叫..." required />
        </label>
        <label>
          想对谁说
          <input type="text" id="to" placeholder="TA 的名字" required />
        </label>
        <label class="full">
          想说的话
          <textarea id="message" rows="4" placeholder="写下你的告白、祝福或想和 TA 约定的未来" required></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">投递到告白墙</button>
          <button type="reset" class="btn ghost">清空重写</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <p class="eyebrow">小心心留言板</p>
          <h2>告白墙</h2>
          <p class="muted">点击爱心可以为喜欢的告白送上一颗心。</p>
        </div>
        <div class="filters">
          <button class="chip" data-filter="latest">最新</button>
          <button class="chip" data-filter="popular">最热</button>
        </div>
      </div>
      <div id="confession-list" class="confession-list"></div>
    </section>
  </main>

  <footer>
    <p>💌 愿每一句喜欢都被听见，愿每一份真心都被珍惜。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
